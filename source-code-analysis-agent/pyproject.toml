[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analyst"
version = "1.0.0"
description = "AI source code analysis agents for modernisation (GitHub Copilot SDK runtime with an Azure OpenAI deployment)."
requires-python = ">=3.11"
dependencies = ["github-copilot-sdk==1.0.34"]  # validated version (pins Copilot runtime 1.0.112); re-run the APIM checks before changing

[project.scripts]
code-analyst = "code_analyst.cli:main"

[tool.setuptools.packages.find]
include = ["code_analyst*"]
