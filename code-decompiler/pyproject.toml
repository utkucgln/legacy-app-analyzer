[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-decompiler"
version = "1.0.0"
description = "Evidence extraction and multi-decompiler reconstruction (Vineflower, CFR, Procyon) of deployed Java web applications."
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7"]

[project.scripts]
legacy-decompiler = "legacy_decompiler.cli:main"

[tool.setuptools.packages.find]
include = ["legacy_decompiler*"]

[tool.setuptools.package-data]
legacy_decompiler = ["java/*.java"]
